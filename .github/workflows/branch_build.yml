name: Build Branch (CLI)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux → ELF
          - os: ubuntu-20.04
            target: x86_64-unknown-linux-gnu
            artifact: branch-linux-x86_64

          # macOS → Mach-O (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: branch-macos-x86_64

          # Windows → PE
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: branch-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build CLI binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/branch*
