<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link href="./output.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
    <style>
      /* styles.css */
        .truncate-button {
          max-width: 160px; /* adjust as needed */
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
              /* styles.css */
        .hide-scrollbar {
          -ms-overflow-style: none;  /* IE/Edge */
          scrollbar-width: none;     /* Firefox */
        }
        .hide-scrollbar::-webkit-scrollbar {
          display: none;             /* Chrome/Safari */
        }
    </style>
  </head>

  <body class="bg-slate-50 text-slate-900">
  <main class="h-screen flex flex-col">

    <!-- Header -->
    <header class="px-4 py-3 border-b bg-white">
      <h1 class="text-lg font-semibold">Branch</h1>
      <p class="text-xs text-slate-500">
        Project Tree Explorer
      </p>
    </header>
    <!-- Content -->
    <!-- Content -->
    <!-- Content -->
    <section class="flex-1 overflow-auto p-4 flex flex-col items-start">
      <!-- Folder Overview: 70% of screen width -->
      <div class="w-[50%] mb-4">
        <div id="folder-overview" class="flex flex-nowrap gap-2 overflow-x-auto pb-1 "></div>
      </div>

      <!-- Tree: 50% of screen width -->
      <div class="w-[50%]">
        <div id="tree" class="bg-white rounded-lg shadow-sm p-4">
          <p class="text-slate-400">Loading…</p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
