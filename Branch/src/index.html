    <style>
  /* Tree line styles */
  .tree-node {
    position: relative;
    padding-left: 20px;
  }

  .tree-node::before {
    content: '';
    position: absolute;
    left: 10px;
    top: 0;
    bottom: 0;
    border-left: 1px solid #ccc;
  }

  .tree-node::after {
    content: '';
    position: absolute;
    left: 10px;
    top: 12px;
    width: 10px;
    border-top: 1px solid #ccc;
  }

  .tree-node.last-child::before {
    height: 12px;
  }

  .tree-node:not(.last-child)::after {
    width: 10px;
  }

  .tree-node.last-child::before {
    height: 12px;
  }

  #code-tree-content > div.tree-node::before,
  #code-tree-content > div.tree-node::after {
    display: none;
  }

  .tree-node > div:first-child {
    position: relative;
    z-index: 1;
    background: white;
    padding-right: 8px;
  }
  
  .truncate-button {
    max-width: 160px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  
  /* Hide scrollbar for file tree */
  .hide-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  
  .hide-scrollbar::-webkit-scrollbar {
    display: none;
  }
  
  /* FOLDER OVERVIEW SCROLLBAR - VERTICAL */
  #folder-overview {
    display: flex;
    flex-direction: column;
    gap: 0.375rem; /* 1.5 */
    max-height: 5rem; /* 80px */
    overflow-y: auto;
    padding-bottom: 0.25rem; /* 1 */
    border: 1px solid #e2e8f0;
    border-radius: 0.25rem;
    padding: 0.25rem;
    background-color: white;
  }
  
  /* WebKit browsers (Chrome, Safari, Edge) */
  #folder-overview::-webkit-scrollbar {
    width: 8px;
  }
  
  #folder-overview::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 4px;
  }
  
  #folder-overview::-webkit-scrollbar-thumb {
    background: #888;
    border-radius: 4px;
  }
  
  #folder-overview::-webkit-scrollbar-thumb:hover {
    background: #555;
  }
  
  /* Firefox */
  #folder-overview {
    scrollbar-width: thin;
    scrollbar-color: #888 #f1f1f1;
  }
</style>
  </head>

      <!-- Right panel: Folder controls + file tree -->

      <!-- Right panel: Folder controls + file tree -->
