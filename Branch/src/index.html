<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <link href="./output.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="/main.js" defer></script>
    <style>
      /* styles.css */
      /* Tree line styles */
.tree-node {
  position: relative;
  padding-left: 20px;
}

.tree-node::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 0;
  bottom: 0;
  border-left: 1px solid #ccc;
}

.tree-node::after {
  content: '';
  position: absolute;
  left: 10px;
  top: 12px;
  width: 10px;
  border-top: 1px solid #ccc;
}

.tree-node.last-child::before {
  height: 12px;
}

.tree-node:not(.last-child)::after {
  width: 10px;
}

.tree-node.last-child::before {
  height: 12px;
}

#code-tree-content > div.tree-node::before,
#code-tree-content > div.tree-node::after {
  display: none;
}

.tree-node > div:first-child {
  position: relative;
  z-index: 1;
  background: white;
  padding-right: 8px;
}
        .truncate-button {
          max-width: 160px; /* adjust as needed */
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
              /* styles.css */
        .hide-scrollbar {
          -ms-overflow-style: none;  /* IE/Edge */
          scrollbar-width: none;     /* Firefox */
        }
        .hide-scrollbar::-webkit-scrollbar {
          display: none;             /* Chrome/Safari */
        }
    </style>
  </head>

  <body class="bg-slate-50 text-slate-900">
  <main class="h-screen flex flex-col">
    <!-- Content -->
    <!-- Main content area: side-by-side panels -->
    <section class="flex-1 overflow-hidden p-4 flex gap-4">
      <!-- Left panel: Code Tree (will be injected here by codeTree.js) -->

      <!-- Right panel: Folder controls + file tree -->
      <div class="w-1/2 flex flex-col">
        <!-- Search + Folder Overview -->
        <div id="folder-controls" class="mb-4">
          <!-- Search bar will be injected here by createSearchBar() -->
          <div id="folder-overview" class="flex flex-nowrap gap-2 overflow-x-auto pb-1 hide-scrollbar"></div>
        </div>

        <!-- File Tree -->
        <div id="tree" class="flex-1 overflow-auto bg-white rounded-lg shadow-sm p-4 text-sm font-mono hide-scrollbar">
          <p class="text-slate-400">Loading…</p>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
