name: Build Branch (Tauri)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - platform: ubuntu-latest
            args: ''
            suffix: 'linux'
            binary_path: 'src-tauri/target/release/branch'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            suffix: 'macos'
            binary_path: 'src-tauri/target/release/branch'
          - platform: windows-latest
            args: ''
            suffix: 'windows'
            binary_path: 'src-tauri/target/release/branch.exe'

    runs-on: ${{ matrix.settings.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.settings.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Branch v${{ github.ref_name }}"
          args: ${{ matrix.settings.args }}
          includeRelease: true

      # NEW: Rename and Upload the raw binary for CLI users
      - name: Upload Raw Binary
        uses: actions/upload-artifact@v4
        with:
          name: branch-cli-${{ matrix.settings.suffix }}
          path: ${{ matrix.settings.binary_path }}