[package]
name = "branch"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "branch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }


[dependencies]
arboard = "3"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-clipboard = "2.1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2.5.0"
rayon = "1.11.0"
tokio = { version = "1", features = ["full"] }

# WASM Interpreter + WASI support
wasmi = "0.38"
wasmi_wasi = "0.38"
wasi-common = "24.0"
cap-std = "3.4"

# Native Git operations
git2 = { version = "0.18", features = ["vendored-openssl", "vendored-libgit2", "ssh"] }
